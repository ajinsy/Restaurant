
<!DOCTYPE html>
<html>
<head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Login</title>
    <link rel="stylesheet" href="style/glassmorphism.css">
</head>

<body>

    <video autoplay muted loop id="bg-video">
        <source src="images/res vedio.mp4" type="video/mp4">
    </video>

    <div class="login-box">
        <h2>Login</h2>

        <form name="myform"
              action="restaurent.html"
              onsubmit="return validateform()">

            <div class="input-box">
                <input type="text"
                       name="na"
                       placeholder="UserName"
                       required>
            </div>

            <div class="input-box">
                <input type="password"
                       name="pa1"
                       placeholder="Password"
                       required>
            </div>

            <div class="input-box">
                <input type="password"
                       name="pa2"
                       placeholder="Re-enter Password"
                       required>
            </div>

            <div class="Options">
                <label>
                    <input type="checkbox" name="remember">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>

            <p>
                Don't have an account?
                <a href="#">Register</a>
            </p>

        </form>
    </div>

   
</body>
</html>
