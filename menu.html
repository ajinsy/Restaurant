<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <link rel="stylesheet" href="style/menu.css">
</head>

<body>

    <div class="menu-wrapper">

        <!-- HEADER -->
        <div class="menu-header">
            <h1>Menu</h1>
            <a href="#">reserve a table</a>
        </div>

        <div class="menu-content">
            <!-- FOOD ITEMS -->
            <main class="food-grid">

                <!-- PIZZA -->
                <div class="food-card pizza">
                    <div class="food-info">
                        <div>
                            <small>pizza</small>
                            <h2>Pepperoni</h2>
                        </div>

                        <div class="price">
                            <small>756 g</small>
                            <strong>$7.20</strong>
                        </div>
                    </div>

                    <img src="images/pizza.jpg" alt="Pepperoni Pizza">

                   
                </div>


                <!-- SALAD -->
                <div class="food-card salad">
                    <div class="food-info">
                        <div>
                            <small>Pasta</small>
                            <h2>Creamy Pasta</h2>
                        </div>

                        <div class="price">
                            <small>342 g</small>
                            <strong>$3.60</strong>
                        </div>
                    </div>

                    <img src="images/creamy-pasta-sauce-recipe-featur.jpg" alt="pasta">

                    
                </div>


                <!-- BURGER -->
                <div class="food-card burger">
                    <div class="food-info">
                        <div>
                            <small>burger</small>
                            <h2>Biggy</h2>
                        </div>

                        <div class="price">
                            <small>417 g</small>
                            <strong>$5.20</strong>
                        </div>
                    </div>

                    <img src="images/burger.jpg" alt="Biggy Burger">
                </div>


                <!-- PANCAKES -->
                <div class="food-card pancakes">
                    <div class="food-info">
                        <div>
                            <small>deserts</small>
                            <h2>Pancackes</h2>
                        </div>

                        <div class="price">
                            <small>170 g</small>
                            <strong>$3.90</strong>
                        </div>
                    </div>

                    <img src="images/pancake images.jpg" alt="Pancakes">

                    <div class="food-icon"></div>
                </div>


                <!-- BEEF -->
                <div class="food-card briyani">
                    <div class="food-info">
                        <div>
                            <small>Briyani</small>
                            <h2>Chicken briyani</h2>
                        </div>

                        <div class="price">
                            <small>402 g</small>
                            <strong>$7.40</strong>
                        </div>
                    </div>

                    <img src="images/chicken-beryani.webp" alt="Chicken Briyani">
                </div>


                <!-- PASTA -->
                <div class="food-card pasta">
                    <div class="food-info">
                        <div>
                            <small>Nuggets</small>
                            <h2>Chicken Nuggets</h2>
                        </div>

                        <div class="price">
                            <small>372 g</small>
                            <strong>$4.10</strong>
                        </div>
                    </div>

                    <img src="images/chicken nuggets.avif" alt="Chicken Nuggets">
                </div>

            </main>

        </div>
    </div>
    

</body>
</html>
