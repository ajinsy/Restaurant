<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .sticky-header{
                position:sticky;
                top:0%;
                background:rgb(233, 5, 47);
                color: white;
                padding: 90px;
                text-align: center;
                font-size: 20px;
                z-index: 1000;
            }
            .card{
                position: relative;
                width: 350px;
                border: 1px solid red;
                padding: 15px;
                margin: 10px;
            }
            .card img{
                width: 100%;
            }
            .sale{
                
                top: 10px;
                left: 10px;
                background: green;
                color: white;
                padding: 5px;
                border-radius: 10px;
            }
            .chat{
                position: fixed;
                bottom: 20px;
                right: 20px;
                color: white;
                padding: 15px;
                border-radius: 50%;
                cursor:pointer;
            }
            .chat img{
                width: 100px;
            }

        </style>
    </head>
    <body>
        <div class="sticky-header">
            AJ Group Of Company
        </div>
        <div class="content">
            <h2>Scroll down</h2>
            <p>low price for Car </p>
            <p>Car</p>
        </div>
        <div class="card">
            <div class="Sale">50%OFF</div>
            <img src="images/carimage-removebg-preview.png" alt="">
            <h1>Aadi Offer</h1>
            <h2>Smart car</h2>
            <p>$10,00,000</p>
        </div>
        <div class="chat">
            <img src="images/images-removebg-preview.png" alt="">
        </div>

    </body>
</html>
